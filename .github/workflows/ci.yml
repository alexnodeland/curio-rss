# CI for the cargo workspace + the desktop frontend. Phase 4 brought the
# desktop head (apps/desktop/src-tauri, curio-desktop) into the workspace,
# so the --workspace jobs compile tauri and need the webkit2gtk/gtk system
# packages; the Rust jobs stay npm-free (the crate builds against a
# placeholder frontendDist), and the CLI head remains the proof that
# curio-core itself is headless (the boundary job checks its tree stays
# webview-free). The frontend rewrite (WP2) added its own npm jobs:
# desktop-lint (biome + eslint + svelte-check, zero warnings),
# desktop-test (vitest + mockIPC with the 70% state/utils coverage
# floor), and frontend-bans (the {@html} + raw-invoke greps).
# Two jobs widen the toolchain/OS axis: test-cross-os runs the headless
# engine + CLI suite on macOS and Windows, and msrv builds every crate on
# its declared rust-version (everything else floats on stable).
# Local mirror: `just ci` (+ `just msrv`; the macOS/Windows legs are CI-only).
#
# Also a reusable workflow: release.yml calls it (`workflow_call`) as the
# `gate` its build jobs `needs`, so a tag on a commit with red CI never
# produces a release. Every action is pinned to a commit SHA (version in the
# trailing comment; dependabot bumps both) — `just workflows` enforces it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install webview system deps (tauri workspace build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every other Rust job builds test targets, and resolver 2 then unifies
      # dev-dependency features (curio-core's `test-support`) into the heads.
      # Libs + bins alone is how a release build sees them: a head that
      # reaches past the facade to `CoreHandle::storage()` fails here.
      # Local mirror: `just check-prod`.
      - name: Type-check production targets (no dev-dependency features)
        run: cargo check --workspace --locked

  test:
    name: test (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install webview system deps (tauri workspace build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace

  test-cross-os:
    # The headless engine + CLI suite on the two non-Linux platforms the
    # desktop head ships to. Path handling, file locking, process spawning
    # and line endings differ there, and a Linux-only gate let such bugs land
    # unseen. Scoped to the webview-free crates, so no system packages and no
    # tauri compile; curio-desktop's own tests stay on the Linux `test` job.
    name: test core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-15 }
          - { name: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --no-fail-fast: one red test binary must not hide the rest of the suite.
      - run: cargo test --locked --no-fail-fast -p curio-core -p curio-types -p curio-cli

  msrv:
    # Builds every crate on exactly the `rust-version` its Cargo.toml
    # declares (read from `cargo metadata`, never restated here): the
    # workspace floor for the engine crates, curio-desktop's own higher one.
    # The other jobs float on stable, so without this a newer-than-declared
    # language feature or dependency lands silently. Local mirror: `just msrv`.
    name: MSRV (declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - name: Install webview system deps (curio-desktop build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bash scripts/check-msrv.sh

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install webview system deps (tauri workspace build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo doc --workspace --no-deps

  coverage:
    # Region floor on crates/curio-core; report-only for the other crates.
    # The floor and the non-core regex mirror `just cov` — ratchet rule in
    # CONTRIBUTING.md: the number only moves up, and it moves in both files
    # together.
    name: coverage (curio-core regions >= 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install webview system deps (tauri workspace build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run the workspace suite under llvm-cov
        run: cargo llvm-cov --workspace --no-report
      - name: Workspace coverage (report-only)
        run: cargo llvm-cov report --summary-only
      - name: Enforce the curio-core region floor
        run: |
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(crates/curio-cli|crates/curio-types|crates/curio-fixtures|xtask|apps/desktop/src-tauri)/' \
            --fail-under-regions 85

  deny:
    name: cargo-deny (advisories, licenses, webview ban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  ipc-contract:
    # The single highest-value gate: regenerate the tauri-specta TS
    # bindings from the Rust command surface and fail on any drift from
    # the committed file — Rust-signature changes cannot ship without
    # their bindings. Local mirror: `just bindings-check`.
    name: ipc-contract (bindings drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install webview system deps (tauri workspace build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Regenerate the bindings
        run: cargo test -p curio-desktop --test export_bindings
      - name: Fail on drift from the committed bindings
        run: git diff --exit-code apps/desktop/src/lib/bindings.ts

  boundary:
    name: webview boundary (curio-core is tauri-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run -p xtask -- boundary

  workflow-lint:
    # Supply-chain shape of .github/: every action SHA-pinned, the release
    # build gated on this workflow, the updater signing key confined to one
    # build-free step, and the draft release carrying SHA256SUMS + SBOM +
    # attestation; no job on a retired runner image, and nightly.yml run by
    # the PRs that edit it, a hard gate, uploading Linux + Windows bundles;
    # release-tag.yml the only workflow that creates tags, and release.yml
    # releasing for real by the tag ref, so its dispatch on the tag signs.
    # Local mirror: `just workflows`.
    name: workflow lint (pins, release gate, signing-key isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run -p xtask -- workflows

  desktop-lint:
    # Zero warnings is a Phase 4 acceptance criterion: biome (TS), eslint
    # (svelte templates — biome cannot lint them), svelte-check.
    name: desktop lint (biome + eslint + svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:eslint
      - run: npm run check

  desktop-test:
    # vitest + mockIPC (tier 1 — real & cheap), including the contract test
    # that invokes every generated wrapper. Coverage floor: 70% on the
    # src/lib state/utils layer; components report-only.
    name: desktop test (vitest + coverage floor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  frontend-bans:
    # {@html} may appear only in the sanitized-render component; raw
    # @tauri-apps/api/core imports only in the generated bindings.
    # Local mirror: `just frontend-bans` (also a lefthook pre-commit step).
    name: frontend bans ({@html} + raw invoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/check-frontend-bans.sh

  blob-guard:
    name: blob-size guard (no object > 1MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fail if any git object exceeds 1MB
        run: |
          set -euo pipefail
          limit=1048576
          oversized=$(git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk -v limit="$limit" '$1 == "blob" && $3 > limit { print $3 " " $2 " " substr($0, index($0, $4)) }' \
            | sort -rn || true)
          if [ -n "$oversized" ]; then
            echo "::error::git objects larger than 1MB found in history:"
            echo "$oversized"
            exit 1
          fi
          echo "blob guard: OK — no object in history exceeds 1MB"
