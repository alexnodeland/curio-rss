# Nightly + on-demand workflow — deliberately NOT per-merge, and per-PR only
# for PRs that touch its own plumbing (see `on:`; ci.yml is the fast PR
# gate). This is the heavy tier: the 3-OS `tauri build`
# matrix that
# produces the shippable (unsigned) bundles, the WebdriverIO + tauri-driver
# smoke on the two platforms a driver exists for (Linux + Windows — there is
# no macOS tauri-driver, so macOS is covered by the manual release checklist),
# and the criterion cold-start benchmark that hosts the Phase-4 <1.5s gate.
#
# Signing is intentionally OFF, permanently: distribution is an unsigned
# Homebrew cask (Apple enrollment skipped, Windows deferred —
# docs/design/decisions.md). The build passes NO signing env, so tauri never
# attempts codesign; the app runs via right-click → Open / xattr. The Tauri
# *updater* artifacts (minisign-signed .tar.gz/.sig) are release.yml's job
# alone — it holds the key — so nightly turns them off via
# src-tauri/tauri.nightly.conf.json instead of failing at the signing step.
name: nightly

on:
  # Daily + on-demand — NOT per-push. The per-PR gate (ci.yml) already
  # validates every change, and release.yml builds the shipped bundles on a
  # tag, so building the full 3-OS matrix on every merge just hammered the
  # (scarce) macOS runners. Dispatch a run manually before a release if you
  # want a fresh cross-platform bundle + e2e + bench.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  # ...plus the PRs that can break the nightly itself: a change to its own
  # plumbing runs bundle + smoke BEFORE it merges instead of turning up red
  # the next morning. That is this file, the tauri configs the bundle merges,
  # the e2e harness, and the desktop npm + crate manifests (`tauri build`
  # refuses to bundle when a tauri npm plugin and its crate disagree on
  # version). Every nightly break fixed so far — the retired macos-13 image,
  # the updater signing step, the plugin-updater mismatch — was such a change.
  # A Cargo.lock-only bump is left to the schedule (it rides most PRs).
  # `just workflows` (xtask) requires this file to stay on the list.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.nightly.conf.json
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/e2e/**
      - apps/desktop/package.json
      - apps/desktop/package-lock.json

# A newer push to the same PR supersedes its run. Scheduled and dispatched
# runs each get a group of their own (the run id), so one stuck run never
# queues — or cancels — the next night's.
concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: tauri build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, bundle: target/release/bundle }
          # One universal (arm64 + x64) build on Apple silicon — the exact
          # path release.yml ships. The Intel `macos-13` image is retired
          # (its leg queued for 24h, then was cancelled, every night), and
          # lipo-ing both arches on one runner needs no Intel host at all.
          - name: macos-universal
            os: macos-14
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
          - { name: windows-x64, os: windows-latest, bundle: target/release/bundle }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux webview + bundling deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build the unsigned bundle
        working-directory: apps/desktop
        # Unsigned, permanently: Apple Developer enrollment is skipped
        # (docs/design/decisions.md), so we pass NO signing env — tauri then
        # produces an unsigned artifact instead of trying (and failing) to
        # `security import` a certificate. Distribution is the unsigned
        # Homebrew cask; the app is run via right-click → Open / xattr.
        # tauri.conf.json sets `createUpdaterArtifacts` (with the updater
        # pubkey) for release.yml, and without TAURI_SIGNING_PRIVATE_KEY the
        # CLI fails AFTER bundling ("A public key has been found, but no
        # private key") — so the merged nightly config turns the updater
        # artifacts off. It is a file, not inline JSON, so no shell's quoting
        # can mangle it; the path is absolute so it does not depend on which
        # directory the CLI resolves it against. bash on every OS (Windows
        # defaults to pwsh), so the `--` forwarding behaves the same on all
        # three.
        shell: bash
        run: |
          npm run tauri build -- \
            --config "$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.nightly.conf.json" \
            ${{ matrix.args }}
      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: curio-${{ matrix.name }}
          # src-tauri is a workspace member, so cargo/tauri emit to the
          # workspace-root target/ (target/<triple>/ for a --target build),
          # not a crate-local one.
          path: |
            ${{ matrix.bundle }}/**/*.dmg
            ${{ matrix.bundle }}/**/*.app
            ${{ matrix.bundle }}/**/*.AppImage
            ${{ matrix.bundle }}/**/*.deb
            ${{ matrix.bundle }}/**/*.rpm
            ${{ matrix.bundle }}/**/*.msi
            ${{ matrix.bundle }}/**/*.exe
          # A bundle job that uploads nothing is a failed job, not a warning.
          if-no-files-found: error

  smoke:
    name: e2e smoke (${{ matrix.name }})
    # A HARD gate: all five scenarios run (none skipped) and a failure fails
    # the job. The harness (apps/desktop/e2e) owns its whole world — a
    # throwaway CURIO_PROFILE seeded through the real `curio` CLI and a
    # 127.0.0.1 feed stub — so it never touches the real network.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04 }
          - { name: windows, os: windows-latest }
    env:
      # Pinned: the WebDriver proxy is part of the gate, so a new release
      # must not change it underneath us. Bump deliberately.
      TAURI_DRIVER_VERSION: 2.1.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json
      - name: Install Linux webview deps + WebKitWebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev webkit2gtk-driver xvfb
      - name: Pick the msedgedriver that matches WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        # tauri-driver drives WebView2 through msedgedriver, which must match
        # the installed WebView2 runtime exactly. Use the image's copy when it
        # matches, else fetch that exact build from Microsoft.
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webview = (Get-ItemProperty -Path $key).pv
          $bundled = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          $driverVersion = ''
          if (Test-Path $bundled) {
            $driverVersion = ((& $bundled --version) -split ' ')[3]
          }
          Write-Host "WebView2 runtime $webview; image msedgedriver '$driverVersion'"
          if ($driverVersion -eq $webview) {
            $driver = $bundled
          } else {
            $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
            $zip = "$dir.zip"
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$webview/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $dir -Force
            $driver = Join-Path $dir 'msedgedriver.exe'
          }
          "TAURI_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install tauri-driver ${{ env.TAURI_DRIVER_VERSION }}
        run: cargo install tauri-driver --locked --version ${{ env.TAURI_DRIVER_VERSION }}
      - name: Build the app + CLI under test (debug)
        working-directory: apps/desktop
        # `tauri build` (not plain cargo) so the frontend is embedded instead
        # of the dev server URL; e2e/tauri.e2e.conf.json points the startup
        # update check at a dead loopback endpoint, keeping the run hermetic.
        # The CLI seeds the throwaway profile before the app boots.
        shell: bash
        run: |
          npm ci
          npm run tauri build -- --debug --no-bundle \
            --config "$GITHUB_WORKSPACE/apps/desktop/e2e/tauri.e2e.conf.json"
          cargo build --locked -p curio-cli
      - name: Install + type-check the e2e harness
        working-directory: apps/desktop/e2e
        run: |
          npm ci
          npm run typecheck
      - name: Run the WebdriverIO smoke suite
        working-directory: apps/desktop/e2e
        shell: bash
        env:
          CURIO_E2E_SHOTS: ${{ runner.temp }}/e2e-failures
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npm test
          else
            npm test
          fi
      - name: "TEMP diagnose: boot the app with remote debugging"
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host '--- leftover processes'; Get-Process | Where-Object { $_.Name -match 'curio|msedge|webview|driver' } | Select-Object Name, Id, StartTime | Format-Table | Out-String | Write-Host
          Get-Process -Name curio-desktop -ErrorAction SilentlyContinue | Stop-Process -Force
          $profileDir = Join-Path $env:RUNNER_TEMP 'diag-profile'
          New-Item -ItemType Directory -Force $profileDir | Out-Null
          $env:CURIO_PROFILE = $profileDir
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\debug\curio-desktop.exe'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'diag-err.txt'
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 25
          Write-Host "alive after 25s: $(-not $p.HasExited) exit=$($p.ExitCode)"
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/version).Content } catch { Write-Host "no devtools on 9222: $_" }
          Write-Host '--- stdout'; Get-Content $out -ErrorAction SilentlyContinue
          Write-Host '--- stderr'; Get-Content $err -ErrorAction SilentlyContinue
          Write-Host '--- profile'; Get-ChildItem -Recurse $profileDir -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
          Get-ChildItem -Recurse (Join-Path $profileDir 'logs') -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          Write-Host '--- webview data'; Get-ChildItem (Join-Path $env:LOCALAPPDATA 'io.github.alexnodeland.curio') -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host '--- processes'; Get-Process | Where-Object { $_.Name -match 'curio|msedge|webview' } | Select-Object Name, Id
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failures-${{ matrix.name }}
          path: ${{ runner.temp }}/e2e-failures
          if-no-files-found: ignore

  bench:
    name: cold-start bench (@50k fixture)
    # Never on a PR: the bench tracks main's trailing baseline, a PR run would
    # compare (and could comment-on-alert) a commit that never merged, and no
    # path in the PR filter above changes what it measures.
    if: github.event_name != 'pull_request'
    # curio-fixtures depends on curio-core only (no webview), so this job
    # needs no gtk/webkit system packages.
    runs-on: ubuntu-22.04
    # `contents: write` is for the alert path only: `comment-on-alert` posts a
    # commit comment through the API. The benchmark HISTORY is NOT kept on a
    # gh-pages branch — it lives in a cached JSON (`external-data-json-path`
    # below), so this job never fetches or pushes a branch. (The old config
    # stored on gh-pages and failed on *every* run — this repo's Pages builds
    # from `main` via the Actions build type, so no gh-pages branch exists and
    # `git fetch gh-pages` died with "couldn't find remote ref gh-pages".)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The rolling benchmark baseline, persisted between nightly runs via the
      # Actions cache instead of a gh-pages branch. A per-run key always writes
      # a fresh cache; `restore-keys` pulls the most recent prior baseline to
      # compare against. The first run finds none, seeds the file, and — with
      # no previous point — cannot alert.
      - name: Restore the rolling benchmark baseline
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./.bench-cache
          key: bench-cold-start-${{ github.run_id }}
          restore-keys: |
            bench-cold-start-
      - name: Run the criterion cold-start benchmark
        # bencher output format is what github-action-benchmark's `cargo`
        # parser consumes; the fixture is generated inside the bench harness.
        # `mkdir -p` guarantees the external-data-json-path parent exists on the
        # first run, before any cache entry has been created.
        run: |
          mkdir -p ./.bench-cache
          cargo bench -p curio-fixtures --bench cold_start -- --output-format bencher \
            | tee bench-output.txt
      - name: Track against the trailing baseline (alert at 130%)
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: cold-start (open + first page @50k)
          tool: cargo
          output-file-path: bench-output.txt
          # Store history in a cached JSON file, NOT on gh-pages: no git fetch,
          # no branch, no push. Comparison + alert + commit-comment still work.
          external-data-json-path: ./.bench-cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "130%"
          comment-on-alert: true
          fail-on-alert: true
          save-data-file: true
