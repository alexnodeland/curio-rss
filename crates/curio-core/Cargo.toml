[package]
name = "curio-core"
description = "The Curio reading engine: fetch, ingest, store, state, export, events — Tauri-free by construction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Post-v1 enrichment providers (D8/D14): each provider is opt-in per
# head. `enrich-reddit` upgrades reddit posts via the public JSON
# endpoint on the load-full / full-text-hydrate path.
enrich-reddit = []
# OS-keychain storage for user secrets (D15). Heads opt in and call the
# `secrets` module explicitly — the core never reads the keychain on its
# own, so core tests stay hermetic.
keychain = ["dep:keyring"]
# Test-only: compiles in the raw `CoreHandle::storage()` accessor so test
# code can seed rows the facade deliberately does not expose. Enabled only
# from `[dev-dependencies]` (this crate's own, the desktop head's), never
# by a production build — a head that bypasses the facade does not compile.
# Test-target builds unify this feature into every head, so CI's
# `just check-prod` step (libs + bins only) is what enforces that per commit.
test-support = []

[dependencies]
ammonia = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
curio-types = { workspace = true }
# The platform data dirs behind `paths::default_profile_dir` — the one
# default profile location both heads open.
directories = { workspace = true }
dom_smoothie = { workspace = true }
ego-tree = { workspace = true }
encoding_rs = { workspace = true }
feed-rs = { workspace = true }
futures-util = { workspace = true }
fs4 = { workspace = true }
htmd = { workspace = true }
icu_normalizer = { workspace = true }
keyring = { workspace = true, optional = true }
markup5ever_rcdom = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
ryu = { workspace = true }
same-file = { workspace = true }
saphyr-parser = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# On top of the workspace's net/time: "sync" — tokio::sync::Mutex backs the
# per-feed refresh serialization (see CoreHandle::refresh_feed), watch and
# Notify the one-sweep-at-a-time slot and its cancel signal; "rt" —
# spawn_blocking, which keeps a refresh's parse/ingest/storage half off the
# async runtime.
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Safe `statfs(2)` for the network-filesystem guard (storage/netfs.rs);
# already in the tree through fs4 and tempfile.
rustix = { workspace = true }

[dev-dependencies]
# Self dev-dependency: the integration tests under tests/ link the library
# with `test-support` on (see the feature above).
curio-core = { path = ".", features = ["test-support"] }
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }

[lints]
workspace = true
