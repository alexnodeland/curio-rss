<p>The standard way to attribute a quotation puts a footer inside the quote:</p>
<blockquote>
  <p>Simplicity is prerequisite for reliability.</p>
  <footer>— <cite>Edsger W. Dijkstra</cite></footer>
</blockquote>
<figure>
  <img src="https://example.com/images/punch-card.jpg" alt="a punch card">
  <figcaption>A program, before version control.</figcaption>
</figure>
<p>Both the attribution and the caption belong to the post.</p>
