<article>
<h1>Fenced code keeps its language</h1>
<p>Highlighters put the language on the code element:</p>
<pre class="highlight"><code class="hljs language-rust">fn main() {
    println!("hello");
}</code></pre>
<p>Prism's lang- alias on the pre element:</p>
<pre class="lang-python"><code>print("hello")</code></pre>
<p>And a block with no language stays a bare fence:</p>
<pre><code>plain text</code></pre>
</article>
